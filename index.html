<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namour ❤️</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <!-- Cœurs flottants -->
    <div class="heart">❤️</div>
    <div class="heart">❤️‍🔥</div>
    <div class="heart">💖</div>
    <div class="heart">💘</div>
    <div class="heart">💖</div>
    <div class="heart">💝</div>

    <!-- Carte principale -->
    <div class="card">
        <div class="card-header">
            <span class="emoji">💌</span>
            <span>Namour...</span>
        </div>
        
        <p class="subtitle">J'ai une question super importante 😊</p>
        
        <p class="question">Est-ce que tu veux être mon Valentin ?</p>
        
        <div class="heart-icon">❤️</div>
        
        <div class="buttons">
            <button class="btn btn-non" id="btnNon">Non 😔</button>
            <button class="btn btn-oui" id="btnOui">Oui ✨</button>
        </div>
        
        <div class="success-message" id="successMsg">
            🎉❤️ Hihi ! <br>Je t'aime fort mon amour et j'ai hâte d'évoluer, découvrir le monde et grandir encore avec toi! 😍</br>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
